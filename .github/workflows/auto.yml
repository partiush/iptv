name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours
  workflow_dispatch:       # Lets you trigger it manually with a button tap

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
      - name: Run playlist updater
        run: python update.py
      - name: Save updated playlist
        run: |
          git config user.name "IPTV Bot"
          git config user.email "bot@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Update playlist" || exit 0
          git push
